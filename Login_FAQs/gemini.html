  <main class="chat-main">
    <section class="chat-card">
      <h1 class="gemini-title">
        Gemini Chat
        <span>Assistant</span>
      </h1>
      <p class="chat-subtitle">Send prompts and chat with Gemini directly from this page.</p>

      <div id="chat-log" class="chat-log" aria-live="polite">
        <article class="chat-message assistant">
          <p>Hello. Enter a prompt below to start chatting.</p>
        </article>
      </div>

      <form id="chat-form" class="chat-form">
        <label for="chat-prompt">Message</label>
        <textarea
          id="chat-prompt"
          name="chat-prompt"
          rows="4"
          maxlength="4000"
          placeholder="Type your prompt here..."
          required
        ></textarea>

        <div class="chat-actions">
          <button type="submit" class="auth-btn">Send</button>
          <button type="button" id="clear-chat" class="nav-link-btn">Clear Chat</button>
        </div>

        <p id="chat-status" class="chat-status" aria-live="polite"></p>
      </form>
    </section>
  </main>
